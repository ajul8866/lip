services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lip}
      POSTGRES_USER: ${POSTGRES_USER:-lip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - lip-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      args:
        VERSION: ${LIP_VERSION:-dev}
        COMMIT: ${LIP_COMMIT:-none}
        BUILD_DATE: ${LIP_BUILD_DATE:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lip}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-lip}?sslmode=disable
      LIP_ADDR: ":8080"
      LIP_IMPORT_ROOT: /data/imports
      LIP_SAFE_LOCAL_ONLY: ${LIP_SAFE_LOCAL_ONLY:-true}
      LIP_EGRESS_ALLOWLIST: ${LIP_EGRESS_ALLOWLIST:-}
      LIP_SETUP_TOKEN: ${LIP_SETUP_TOKEN:-}
      LIP_SECURE_COOKIES: ${LIP_SECURE_COOKIES:-false}
      LIP_MAX_CONCURRENT_TASKS: ${LIP_MAX_CONCURRENT_TASKS:-2}
      LIP_AUTORUN: ${LIP_AUTORUN:-true}
      LIP_AUTO_MIGRATE: "true"
      LIP_DEFAULT_LOCALE: ${LIP_DEFAULT_LOCALE:-en}
      LIP_LOG_FORMAT: ${LIP_LOG_FORMAT:-json}
      LIP_LOG_LEVEL: ${LIP_LOG_LEVEL:-info}
    ports:
      - "${LIP_BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - ./data/imports:/data/imports:ro
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lip-db:
